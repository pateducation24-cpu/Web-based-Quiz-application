{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Logged Out - QuizApp</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>👋 You've been logged out</h2>
        <p>Thank you for using QuizApp!</p>
        <a href="/login/" class="btn">Login Again</a>
        <a href="/" class="btn">Home</a>
    </div>
</body>
</html>
